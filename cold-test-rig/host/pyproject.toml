[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rigctl"
version = "1.0.0"
description = "Cold-test rig control: valve and LED shots over USB serial, pressure + video capture, reports"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "numpy>=1.24", "matplotlib>=3.7", "pyyaml>=6", "click>=8"]

[project.scripts]
rigctl = "rigctl.cli:main"

[tool.setuptools]
packages = ["rigctl"]
